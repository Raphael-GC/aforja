name: Android CI

# Builda e testa o projeto a cada push/PR — é a rede de segurança que valida
# automaticamente se uma atualização de dependência (ex: Quartz, via Dependabot)
# quebrou alguma coisa antes de ser aceita. Ver briefing.md Seção 6.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Dar permissão de execução ao gradlew
        run: chmod +x ./gradlew

      - name: Build (debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Testes unitários
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Publicar relatório de testes (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/build/reports/tests/"
